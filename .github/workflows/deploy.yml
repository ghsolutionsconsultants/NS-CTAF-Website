name: Build & deploy to Hostinger

# Builds the Next.js static export and uploads it straight into public_html
# over FTPS. Hostinger does no building and no git pull — it only serves the
# files we put there, which removes every moving part that previously left the
# live site stale.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sanity-check the build
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — refusing to deploy"; exit 1; }
          echo "Publishing $(find out -type f | wc -l) files."

      - name: Check FTP credentials are configured
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_HOST" ]     && missing="$missing FTP_HOST"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions. Values come from hPanel > Files > FTP Accounts."
            exit 1
          fi
          echo "FTP credentials present."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to web root over FTP(S)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -uo pipefail

          # lftp commands are written to a file one per line. Previously a
          # multi-line shell string was passed to `lftp -c`, so the YAML
          # indentation leaked into the command text and lftp failed before
          # it ever connected - producing an empty error message.
          make_script() {
            mode="$1"; shift
            {
              echo "debug 3"
              echo "set ftp:passive-mode on"
              echo "set net:max-retries 2"
              echo "set net:timeout 30"
              echo "set ssl:verify-certificate no"
              if [ "$mode" = "ftps" ]; then
                echo "set ftp:ssl-force true"
                echo "set ftp:ssl-protect-data true"
              else
                echo "set ftp:ssl-allow false"
              fi
              echo "open --env-password -u '$FTP_USERNAME' '$FTP_HOST'"
              for c in "$@"; do echo "$c"; done
            } > /tmp/lftp.cmds
          }

          MODE=""
          for m in ftps plain; do
            echo "=============== connection attempt: $m ==============="
            make_script "$m" "pwd" "cls -1"
            if lftp -f /tmp/lftp.cmds 2>&1; then
              MODE="$m"
              echo "Connected over $m."
              break
            fi
            echo "Attempt over $m failed (see server output above)."
          done

          if [ -z "$MODE" ]; then
            echo "::error::Could not connect over FTPS or plain FTP - see server output above."
            exit 1
          fi
          if [ "$MODE" = "plain" ]; then
            echo "::warning::Connected over plain FTP; credentials are unencrypted in transit."
          fi

          echo "=============== uploading to web root ==============="
          make_script "$MODE" "mirror --reverse --delete --parallel=4 --exclude-glob .well-known/ --exclude-glob cgi-bin/ out/ ./" "cls -l"
          lftp -f /tmp/lftp.cmds 2>&1
