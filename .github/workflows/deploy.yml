name: Build & publish static export

# Builds the Next.js static export on every push to main and publishes the
# contents of `out/` to the `hostinger-deploy` branch (static files at the
# branch root). Point Hostinger hPanel -> Git at the `hostinger-deploy` branch
# with auto-deployment enabled so it pulls on every update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Publish out/ to hostinger-deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b hostinger-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
