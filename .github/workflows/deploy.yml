name: Build & deploy to Hostinger

# Builds the Next.js static export and uploads it straight into public_html
# over FTPS. Hostinger does no building and no git pull — it only serves the
# files we put there, which removes every moving part that previously left the
# live site stale.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Sanity-check the build
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — refusing to deploy"; exit 1; }
          echo "Publishing $(find out -type f | wc -l) files."

      - name: Check FTP credentials are configured
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_HOST" ]     && missing="$missing FTP_HOST"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions. Values come from hPanel > Files > FTP Accounts."
            exit 1
          fi
          echo "FTP credentials present."

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to public_html over FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # Shared connection settings. The password is passed via LFTP_PASSWORD
          # and --env-password so it never appears in a command string.
          COMMON="set ftp:ssl-force true;
                  set ftp:ssl-protect-data true;
                  set ssl:verify-certificate no;
                  set net:max-retries 2;
                  set net:timeout 30;
                  open --env-password -u '$FTP_USERNAME' '$FTP_HOST';"

          echo "--- Remote listing at login ---"
          LIST=$(lftp -c "$COMMON cls -1;" 2>&1) || {
            echo "::error::Could not connect or list over FTPS. Server said:"
            echo "$LIST"
            exit 1
          }
          echo "$LIST"

          # This account's FTP user lands directly IN the web root — proven:
          # mirroring to public_html/ produced public_html/public_html, which
          # was publicly reachable at /public_html/. So upload to "." and let
          # mirror --delete clear that stray copy. Not auto-detected, because
          # the stray directory is itself named public_html and would fool it.
          TARGET="./"

          echo "--- Uploading to: $TARGET ---"

          lftp -c "$COMMON
            mirror --reverse --delete --parallel=4 \
                   --exclude-glob .well-known/ \
                   --exclude-glob cgi-bin/ \
                   out/ '$TARGET';"

          echo "--- Verifying index.html landed ---"
          lftp -c "$COMMON cls -l '$TARGET' | head -30;"
