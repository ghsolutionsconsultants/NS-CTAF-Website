name: Build & publish static export

# Builds the Next.js static export on every push to main and publishes the
# contents of `out/` to the `hostinger-deploy` branch (static files at the
# branch root). Point Hostinger hPanel -> Git at the `hostinger-deploy` branch
# with auto-deployment enabled so it pulls on every update.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Publish out/ to hostinger-deploy branch
        # Commit on top of the existing deploy-branch history so Hostinger's
        # `git pull` can always fast-forward. A fresh `git init` + force-push
        # would give the branch an unrelated history every run, which makes
        # Hostinger's pull fail and silently leaves the live site on an old
        # build. Never force-push this branch.
        run: |
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REMOTE" hostinger-deploy >/dev/null 2>&1; then
            git clone --branch hostinger-deploy --single-branch "$REMOTE" deploy-repo
          else
            git clone "$REMOTE" deploy-repo
            git -C deploy-repo checkout --orphan hostinger-deploy
            git -C deploy-repo rm -rfq --cached . || true
          fi

          # Replace the working tree with the fresh build, keeping .git intact.
          find deploy-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a out/. deploy-repo/
          touch deploy-repo/.nojekyll

          cd deploy-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -q -m "Deploy ${GITHUB_SHA::7}"
            git push origin hostinger-deploy
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
